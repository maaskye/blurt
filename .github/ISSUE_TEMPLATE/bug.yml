name: Bug report
description: Report a reproducible problem in blurt.
title: "Bug: "
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux development build]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
